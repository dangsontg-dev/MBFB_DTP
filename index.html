<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B3C">
<title>Điều Phối PVT</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --petrol-900: #0E3B3C; --petrol-700: #1B5556; --paper: #FAF6EF;
    --ink: #20211D; --ink-soft: #6B6D64; --amber: #E8A33D; --amber-deep: #B9791C;
    --alert: #B23A2E; --ok: #4C7A5E; --line: #E3DDCF;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  header { background: var(--petrol-900); color: var(--paper); padding: calc(env(safe-area-inset-top,0px) + 16px) 18px 14px; position: sticky; top: 0; z-index: 10; }
  .head-row { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .brand-mark { font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; color: var(--amber); }
  h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .who { font-family: var(--mono); font-size: 11px; color: rgba(250,246,239,0.75); text-align: right; max-width: 55%; line-height: 1.5; }
  .who b { color: var(--paper); }

  main { flex: 1; padding-bottom: 40px; }
  .pad { padding: 16px; }
  .empty { padding: 60px 24px; text-align: center; color: var(--ink-soft); font-size: 14px; }

  /* ---- Login ---- */
  .login-wrap { padding: 60px 24px; text-align: center; }
  .login-wrap h2 { font-size: 17px; margin-bottom: 6px; }
  .login-wrap p { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }

  /* ---- Form chung ---- */
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 5px; }
  label.req::after { content: ' *'; color: var(--alert); }
  input[type=text], input[type=tel], input[type=number], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--sans); font-size: 15px; background: #fff; color: var(--ink);
  }
  textarea { resize: vertical; min-height: 60px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 4px; font-family: var(--sans);
    font-weight: 600; font-size: 14.5px; cursor: pointer; margin-top: 14px;
  }
  .btn-primary { background: var(--petrol-900); color: var(--paper); }
  .btn-primary:active { background: var(--petrol-700); }
  .btn-amber { background: var(--amber); color: var(--petrol-900); }
  .btn-amber:active { background: var(--amber-deep); }
  .btn-danger { background: #fff; color: var(--alert); border: 1px solid var(--alert); }
  .btn-outline { background: #fff; color: var(--petrol-900); border: 1px solid var(--petrol-900); }
  .btn:disabled { opacity: 0.5; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { margin-top: 14px; }

  /* ---- Danh sách ---- */
  .ticket { border-bottom: 1px solid var(--line); display: flex; cursor: pointer; }
  .rail { width: 4px; flex-shrink: 0; }
  .rail.wait { background: var(--petrol-700); } .rail.doing { background: var(--amber); } .rail.overdue { background: var(--alert); }
  .ticket-body { flex: 1; padding: 13px 16px; }
  .ticket-top { display: flex; justify-content: space-between; gap: 10px; }
  .ticket-id { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .elapsed { font-family: var(--mono); font-size: 11px; }
  .elapsed.overdue { color: var(--alert); font-weight: 600; } .elapsed.doing { color: var(--amber-deep); } .elapsed.wait { color: var(--ink-soft); }
  .cust { font-size: 15.5px; font-weight: 600; margin-top: 3px; }
  .subline { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .badge-done { display: inline-block; font-size: 10.5px; background: #E7EFE9; color: var(--ok); padding: 2px 7px; border-radius: 3px; margin-top: 4px; }

  /* ---- Chi tiết ---- */
  .back-row { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; font-size: 13px; color: var(--petrol-900); cursor: pointer; }
  .detail-card { margin: 14px 16px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .detail-card .row { font-size: 13.5px; line-height: 1.8; }
  .detail-card .row b { color: var(--ink-soft); font-weight: 500; }
  .step-box { margin: 0 16px 16px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .step-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .step-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }

  .photo-slot { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 4px; margin-top: 8px; }
  .photo-slot img { width: 48px; height: 48px; object-fit: cover; border-radius: 3px; }
  .photo-slot .ph-info { flex: 1; font-size: 13px; }
  .photo-slot .ph-status { font-size: 11.5px; color: var(--ink-soft); }
  .photo-slot .ph-status.done { color: var(--ok); }
  .photo-slot button { padding: 7px 12px; border-radius: 3px; border: 1px solid var(--petrol-900); background: #fff; color: var(--petrol-900); font-size: 12.5px; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom,0px) + 16px);
    background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 4px;
    font-size: 13.5px; text-align: center; opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--alert); }

  footer { padding: 16px 20px calc(env(safe-area-inset-bottom,0px) + 16px); font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono); text-align: center; border-top: 1px solid var(--line); }
  footer span { text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="brand" onclick="veTrangChu()">
      <span class="brand-mark">PVT/</span>
      <h1>Điều Phối</h1>
    </div>
    <div class="who" id="whoBox"></div>
  </div>
</header>

<main id="main"></main>
<footer id="footerNote"></footer>
<div class="toast" id="toast"></div>

<script>
  // ============================================================
  // CẤU HÌNH KẾT NỐI — Sơn dán URL Web App + Key vào đây sau khi deploy
  // ============================================================
  const API_CONFIG = {
      url: 'https://script.google.com/macros/s/AKfycbxhwStVgHoTat7MxIh0yf-KUtORWlKpC8RFkspyfYPDvkvdD7m9MGstVIJvNXTdSrUU-Q/exec',   // VD: https://script.google.com/macros/s/AKfycb.../exec
    key: 'pvt20262k9'    // đúng giá trị đã điền ở dòng PWA_API_KEY trong sheet Config
  };
  const CHUA_CAU_HINH = API_CONFIG.url.indexOf('DÁN_URL') === 0;

  let nguoi = null;       // { ten, code, chatId, vaiTro, khuVuc, doiTac }
  let view = 'login';     // 'login' | 'home' | 'newRequest' | 'detail'
  let queueData = [];
  let detailItem = null;
  let anhDangCho = {};    // lưu tạm URL ảnh đã upload cho form nghiệm thu, trước khi Gửi

  const $ = (sel) => document.querySelector(sel);
  const main = () => document.getElementById('main');

  function showToast(msg, err) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  function fmtElapsed(min) {
    if (min === null || min === undefined) return '—';
    if (min < 60) return min + 'p';
    return Math.floor(min / 60) + 'h' + (min % 60) + 'p';
  }

  /* ==================== GỌI API ==================== */
  async function apiGet(action, extraParams) {
    const params = new URLSearchParams(Object.assign({ action, key: API_CONFIG.key }, extraParams || {}));
    const res = await fetch(API_CONFIG.url + '?' + params.toString());
    return res.json();
  }
  async function apiPost(endpoint, extra) {
    const body = Object.assign({ pwaAction: true, endpoint, code: nguoi ? nguoi.code : null }, extra || {});
    const res = await fetch(API_CONFIG.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body)
    });
    return res.json();
  }

  /* ==================== ĐĂNG NHẬP ==================== */
  function renderLogin() {
    document.getElementById('whoBox').textContent = '';
    document.getElementById('footerNote').textContent = '';
    if (CHUA_CAU_HINH) {
      main().innerHTML = `<div class="login-wrap"><h2>Chưa cấu hình API</h2>
        <p>Sơn cần dán URL Web App + Key vào phần <code>API_CONFIG</code> đầu file index.html trước khi dùng.</p></div>`;
      return;
    }
    main().innerHTML = `
      <div class="login-wrap">
        <h2>Đăng nhập</h2>
        <p>Nhập mã truy cập được cấp để vào hệ thống</p>
        <input type="text" id="loginCode" placeholder="Mã truy cập" autocomplete="off" style="text-align:center;font-size:18px;letter-spacing:2px">
        <button class="btn btn-primary" onclick="thucHienDangNhap()">Đăng nhập</button>
      </div>`;
    document.getElementById('loginCode').addEventListener('keydown', e => { if (e.key === 'Enter') thucHienDangNhap(); });
  }

  async function thucHienDangNhap() {
    const code = document.getElementById('loginCode').value.trim();
    if (!code) return;
    try {
      const res = await apiGet('login', { code });
      if (!res.ok) { showToast(res.error || 'Sai mã truy cập', true); return; }
      nguoi = res.nguoi;
      localStorage.setItem('dieuphoi_code', code);
      view = 'home';
      render();
    } catch (err) {
      showToast('Không kết nối được, thử lại', true);
    }
  }

  function dangXuat() {
    localStorage.removeItem('dieuphoi_code');
    nguoi = null; view = 'login'; render();
  }

  function veTrangChu() { if (nguoi) { view = 'home'; render(); } }

  /* ==================== TRANG CHỦ (hàng chờ) ==================== */
  async function renderHome() {
    document.getElementById('whoBox').innerHTML = `<b>${nguoi.ten}</b> (${nguoi.vaiTro}) · <span style="text-decoration:underline;cursor:pointer" onclick="dangXuat()">Đăng xuất</span>`;
    document.getElementById('footerNote').textContent = 'Đang tải…';
    main().innerHTML = `<div class="pad"></div>`;

    try {
      const res = await apiGet('myqueue', { code: nguoi.code });
      if (res.error) { showToast(res.error, true); return; }
      queueData = res.ds || [];
      document.getElementById('footerNote').textContent = 'Đã cập nhật · ' + new Date().toLocaleTimeString('vi-VN');
    } catch (err) {
      showToast('Không tải được danh sách', true);
      document.getElementById('footerNote').textContent = 'Không kết nối được';
    }

    let html = '';
    if (nguoi.vaiTro === 'KD' || nguoi.vaiTro === 'ADMIN') {
      html += `<div class="pad" style="padding-bottom:0"><button class="btn btn-amber" onclick="moTaoYeuCau()">➕ Tạo yêu cầu mới</button></div>`;
    }
    if (!queueData.length) {
      html += `<div class="empty">Không có việc nào trong hàng chờ 🎉</div>`;
    } else {
      html += queueData.map(renderDongDanhSach).join('');
    }
    main().innerHTML = html;
  }

  function renderDongDanhSach(item) {
    const xong = !item.dangChoToi;
    return `
      <div class="ticket" onclick="moChiTiet('${item.id}')">
        <div class="rail ${xong ? '' : item.urgency}"></div>
        <div class="ticket-body">
          <div class="ticket-top">
            <span class="ticket-id">${item.id}</span>
            ${xong ? '' : `<span class="elapsed ${item.urgency}">${fmtElapsed(item.elapsedMin)}</span>`}
          </div>
          <div class="cust">${item.ten || '(chưa rõ)'}</div>
          <div class="subline">${item.xa || ''} ${item.kenh ? '· ' + item.kenh : ''}</div>
          <div class="subline">${item.trangThai || ''}</div>
          ${xong ? '<span class="badge-done">✓ Đã xong</span>' : ''}
        </div>
      </div>`;
  }

  /* ==================== TẠO YÊU CẦU MỚI ==================== */
  function moTaoYeuCau() { view = 'newRequest'; render(); }

  function renderNewRequest() {
    document.getElementById('footerNote').textContent = '';
    main().innerHTML = `
      <div class="back-row" onclick="veTrangChu()">← Quay lại</div>
      <div class="step-box">
        <div class="step-title">Tạo yêu cầu mới</div>
        <label class="req">Tên KH</label><input type="text" id="f_ten">
        <label class="req">Số ĐT</label><input type="tel" id="f_sdt">
        <label class="req">Vị trí (lat, long)</label>
        <div class="btn-row">
          <input type="text" id="f_viTri" placeholder="VD: 10.36,106.37" style="flex:1">
          <button class="btn btn-outline" style="width:auto;white-space:nowrap;padding:0 14px" onclick="layViTriGPS()">📍 GPS</button>
        </div>
        <label>Số nhà, tên đường</label><input type="text" id="f_soNha">
        <label class="req">Xã, Phường</label><input type="text" id="f_xa" placeholder='VD: "Xã Mỹ Phong"'>
        <div class="hint">Bắt buộc có chữ "Xã" hoặc "Phường" phía trước tên.</div>
        <button class="btn btn-primary" onclick="guiTaoYeuCau(this)">Tạo yêu cầu</button>
      </div>`;
  }

  function layViTriGPS() {
    if (!navigator.geolocation) { showToast('Trình duyệt không hỗ trợ định vị', true); return; }
    showToast('Đang lấy vị trí…');
    navigator.geolocation.getCurrentPosition(
      pos => { document.getElementById('f_viTri').value = pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6); },
      () => showToast('Không lấy được vị trí, nhập tay', true)
    );
  }

  async function guiTaoYeuCau(btn) {
    const ten = $('#f_ten').value.trim(), sdt = $('#f_sdt').value.trim(), viTri = $('#f_viTri').value.trim();
    const soNha = $('#f_soNha').value.trim(), xa = $('#f_xa').value.trim();
    if (!ten || !sdt || !viTri || !xa) { showToast('Thiếu thông tin bắt buộc', true); return; }
    const parts = viTri.split(',').map(s => s.trim());
    if (parts.length !== 2 || isNaN(parseFloat(parts[0])) || isNaN(parseFloat(parts[1]))) {
      showToast('Vị trí không hợp lệ, VD: 10.36,106.37', true); return;
    }
    btn.disabled = true; btn.textContent = 'Đang tạo…';
    try {
      const res = await apiPost('taoYeuCauMoi', { data: { ten, sdt, lat: parts[0], lng: parts[1], soNhaTenDuong: soNha, xa } });
      if (res.ok) {
        showToast('✅ Đã tạo yêu cầu ' + res.id);
        view = 'home'; render();
      } else {
        showToast(res.error || 'Có lỗi xảy ra', true);
        btn.disabled = false; btn.textContent = 'Tạo yêu cầu';
      }
    } catch (err) {
      showToast('Không kết nối được', true);
      btn.disabled = false; btn.textContent = 'Tạo yêu cầu';
    }
  }

  /* ==================== CHI TIẾT 1 YÊU CẦU + HÀNH ĐỘNG THEO BƯỚC ==================== */
  async function moChiTiet(id) {
    view = 'detail';
    detailItem = queueData.find(x => x.id === id) || { id };
    anhDangCho = {};
    render();
    try {
      const res = await apiGet('detail', { id });
      if (res.req) { detailItem = Object.assign({}, detailItem, res.req, { id }); renderDetailBody(); }
    } catch (err) { /* giữ dữ liệu rút gọn đã có nếu tải chi tiết lỗi */ }
  }

  function renderDetail() {
    document.getElementById('footerNote').textContent = '';
    main().innerHTML = `<div class="back-row" onclick="veTrangChu()">← Quay lại</div><div id="detailBody"></div>`;
    renderDetailBody();
  }

  function renderDetailBody() {
    const box = document.getElementById('detailBody');
    if (!box) return;
    const d = detailItem;
    box.innerHTML = `
      <div class="detail-card">
        <div class="row"><b>Mã YC:</b> ${d.id}</div>
        <div class="row"><b>KH:</b> ${d.TenKH || d.ten || ''} ${d.SoDT_KH ? '— ' + d.SoDT_KH : ''}</div>
        <div class="row"><b>Địa chỉ:</b> ${d.DiaChiDayDu || d.xa || ''}</div>
        <div class="row"><b>Khu vực:</b> ${d.KhuVuc || ''} ${d.DoiTac ? '(' + d.DoiTac + ')' : ''}</div>
        <div class="row"><b>Loại kênh:</b> ${d.LoaiKenh || d.kenh || '(chưa chọn)'}</div>
        <div class="row"><b>Trạng thái:</b> ${MO_TA_TT_CLIENT[d.TrangThai] || d.trangThai || d.TrangThai || ''}</div>
      </div>
      <div id="stepArea"></div>`;
    renderBuocHanhDong(d.TrangThai || d.trangThaiRaw);
  }

  // Mô tả trạng thái phía client (chỉ để hiển thị đẹp — không phải nguồn xử lý logic)
  const MO_TA_TT_CLIENT = {
    'CHO_XAC_NHAN_XA': 'Chờ xác nhận Xã/Khu vực', 'CHO_CHON_KENH': 'Chờ chọn loại kênh',
    'CHO_DT_TRA_LOI': 'Chờ Đối tác trả lời', 'CHO_QLKV_CHOT': 'Chờ QLKV chốt kết quả',
    'CHO_GOICUOC_TOANTRINH': 'Chờ nhập Gói cước', 'CHO_BAO_NET': 'Chờ báo ĐT khai báo Net',
    'CHO_PORT_INFO': 'Chờ nhập thông tin Port', 'CHO_KHAI_BAO_NET': 'Chờ khai báo Net xong',
    'CHO_DT_HOAN_THANH': 'Chờ ĐT hoàn thành', 'CHO_KD_KY_HD': 'Chờ KD ký HĐ với KH',
    'CHO_KD_GUI_TTKH': 'Chờ KD gửi thông tin kênh', 'CHO_QLKV_GUI_DT': 'Chờ QLKV chuyển ĐT',
    'CHO_DT_TIEPNHAN_CAUHINH': 'Chờ ĐT tiếp nhận cấu hình', 'CHO_DT_NGHIEMTHU': 'Chờ ĐT nghiệm thu',
    'CHO_QLKV_XEM_NGHIEMTHU': 'Chờ QLKV xét duyệt nghiệm thu', 'CHO_QLKV_NGHIEMTHU_WEBTCT': 'Chờ QLKV nghiệm thu Web TCT',
    'CHO_KD_GOI_KH': 'Chờ KD gọi báo KH', 'HOAN_TAT': '✅ Hoàn tất',
    'KET_THUC_KHONG_DAP_UNG': 'Kết thúc — không đáp ứng', 'KET_THUC_KH_KHONG_KY_HD': 'Kết thúc — KH không ký HĐ', 'DA_HUY': 'Đã huỷ'
  };

  function renderBuocHanhDong(trangThai) {
    const box = document.getElementById('stepArea');
    if (!box) return;
    const b = BUOC_UI[trangThai];
    if (!b) { box.innerHTML = ''; return; } // trạng thái kết thúc hoặc không có hành động web -> không hiện gì
    box.innerHTML = b.html(detailItem);
    if (b.sauKhiRender) b.sauKhiRender(detailItem);
  }

  /** Gọi 1 hành động đơn giản (button, không cần nhập liệu) */
  async function goiHanhDong(action, data, btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Đang xử lý…'; }
    try {
      const res = await apiPost('hanhDong', { loai: 'kenhmoi', id: detailItem.id, action, data: data || null });
      if (res.ok) { showToast('✅ Đã xử lý'); veTrangChu(); }
      else { showToast(res.error || 'Có lỗi xảy ra', true); if (btn) { btn.disabled = false; renderDetailBody(); } }
    } catch (err) { showToast('Không kết nối được', true); if (btn) { btn.disabled = false; renderDetailBody(); } }
  }

  /* ---- Cấu hình giao diện cho từng bước (data-driven) ---- */
  const BUOC_UI = {
    'CHO_XAC_NHAN_XA': { html: () => `
      <div class="step-box">
        <div class="step-title">Xác nhận Xã/Khu vực</div>
        <div class="step-sub">Xã dự đoán: <b>${detailItem.Xa_DuDoan || ''}</b></div>
        <button class="btn btn-primary" onclick="goiHanhDong('xa_ok', null, this)">✅ Tiếp nhận (đúng)</button>
        <label>Hoặc sửa lại Xã/Phường đúng</label>
        <input type="text" id="in_xaMoi" placeholder='VD: "Xã Mỹ Phong"'>
        <button class="btn btn-outline" onclick="goiHanhDong('xa_sua', {xaMoi: $('#in_xaMoi').value.trim()}, this)">Gửi Xã đã sửa</button>
      </div>` },

    'CHO_CHON_KENH': { html: () => `
      <div class="step-box">
        <div class="step-title">Chọn loại kênh</div>

  function anhPreviewRow(url, ten) {
    if (!url) return '';
    return `<div class="photo-slot"><img src="${url}"><div class="ph-info">${ten}</div></div>`;
  }

  /* ==================== FORM NGHIỆM THU (nhiều trường + 4 ảnh) ==================== */
  const ANH_CAN_THIET = [
    { key: 'anhBB', ten: 'Biên bản nghiệm thu' }, { key: 'anhSpeedtest', ten: 'Speedtest' },
    { key: 'anhSerial', ten: 'Tem serial modem' }, { key: 'anhLapDat', ten: 'Hình ảnh lắp đặt' }
  ];

  function renderFormNghiemThu() {
    const anhRows = ANH_CAN_THIET.map(a => `
      <div class="photo-slot" id="slot_${a.key}">
        ${anhDangCho[a.key] ? `<img src="${anhDangCho[a.key]}">` : ''}
        <div class="ph-info">${a.ten}<div class="ph-status ${anhDangCho[a.key] ? 'done' : ''}">${anhDangCho[a.key] ? '✓ Đã chọn' : 'Chưa chọn ảnh'}</div></div>
        <button onclick="document.getElementById('file_${a.key}').click()">${anhDangCho[a.key] ? 'Đổi ảnh' : 'Chọn ảnh'}</button>
        <input type="file" accept="image/*" capture="environment" id="file_${a.key}" style="display:none" onchange="chonVaUploadAnh('${a.key}', this)">
      </div>`).join('');

    return `
      <div class="step-box">
        <div class="step-title">Nghiệm thu lắp đặt</div>
        <label class="req">OLT (6 ký tự)</label><input type="text" id="in_olt">
        <label class="req">AP2 (dạng AP2-x-y)</label><input type="text" id="in_ap2">
        <label class="req">Nhãn hiệu Modem</label><input type="text" id="in_nhanHieu">
        <label class="req">Serial Modem</label><input type="text" id="in_serial">
        <div class="hint">Dùng đúng Serial còn trống trong kho — hỏi Khang/QLKV nếu chưa rõ.</div>
        <label class="req">Tình trạng modem</label>
        <select id="in_tinhTrang"><option value="">— Chọn —</option><option value="mới">Mới</option><option value="cũ">Cũ</option></select>
        <label class="req">Loại cáp</label>
        <select id="in_loaiCap"><option value="">— Chọn —</option><option value="1fo">1fo</option><option value="2fo">2fo</option></select>
        <label class="req">Chiều dài cáp thi công (m)</label><input type="number" id="in_capThiCong">
        <label>Vật tư khác</label><input type="text" id="in_vatTuKhac">

        <label class="req" style="margin-top:18px">Ảnh nghiệm thu (đủ 4 ảnh)</label>
        ${anhRows}

        <button class="btn btn-primary" onclick="guiNghiemThu(this)">Gửi nghiệm thu</button>
      </div>`;
  }

  /** Nén ảnh phía client trước khi upload (giới hạn cạnh dài nhất 1400px, JPEG chất lượng 0.75) để nhẹ, nhanh */
  function nenAnh(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.onload = () => {
        const MAX = 1400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75).split(',')[1]);
      }; img.onerror = reject; img.src = e.target.result; };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function chonVaUploadAnh(key, inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    const slot = document.getElementById('slot_' + key);
    slot.querySelector('.ph-status').textContent = 'Đang tải lên…';
    try {
      const base64 = await nenAnh(file);
      const res = await apiPost('uploadAnh', { anhBase64: base64 });
      if (res.ok) {
        anhDangCho[key] = res.url;
        renderDetailBody();
        showToast('✅ Đã tải ảnh lên');
      } else {
        showToast(res.error || 'Tải ảnh thất bại', true);
        slot.querySelector('.ph-status').textContent = 'Chưa chọn ảnh';
      }
    } catch (err) {
      showToast('Tải ảnh thất bại, thử lại', true);
      slot.querySelector('.ph-status').textContent = 'Chưa chọn ảnh';
    }
  }

  async function guiNghiemThu(btn) {
    const data = {
      olt: $('#in_olt').value.trim(), ap2: $('#in_ap2').value.trim(),
      nhanHieu: $('#in_nhanHieu').value.trim(), serial: $('#in_serial').value.trim(),
      tinhTrang: $('#in_tinhTrang').value, loaiCap: $('#in_loaiCap').value,
      capThiCong: $('#in_capThiCong').value.trim(), vatTuKhac: $('#in_vatTuKhac').value.trim(),
      anhBB: anhDangCho.anhBB, anhSpeedtest: anhDangCho.anhSpeedtest,
      anhSerial: anhDangCho.anhSerial, anhLapDat: anhDangCho.anhLapDat
    };
    if (!data.olt || !data.ap2 || !data.nhanHieu || !data.serial || !data.tinhTrang || !data.loaiCap || !data.capThiCong) {
      showToast('Thiếu thông tin bắt buộc', true); return;
    }
    if (!data.anhBB || !data.anhSpeedtest || !data.anhSerial || !data.anhLapDat) {
      showToast('Cần đủ 4 ảnh trước khi gửi', true); return;
    }
    btn.disabled = true; btn.textContent = 'Đang gửi…';
    try {
      const res = await apiPost('nghiemThu', { id: detailItem.id, data });
      if (res.ok) { showToast('✅ Đã gửi nghiệm thu'); veTrangChu(); }
      else { showToast(res.error || 'Có lỗi xảy ra', true); btn.disabled = false; btn.textContent = 'Gửi nghiệm thu'; }
    } catch (err) {
      showToast('Không kết nối được', true); btn.disabled = false; btn.textContent = 'Gửi nghiệm thu';
    }
  }

  /* ==================== ĐIỀU HƯỚNG CHUNG ==================== */
  function render() {
    if (view === 'login') renderLogin();
    else if (view === 'home') renderHome();
    else if (view === 'newRequest') renderNewRequest();
    else if (view === 'detail') renderDetail();
  }

  // ==== Đăng ký Service Worker + khởi động ====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
  }

  (async function khoiDong() {
    if (CHUA_CAU_HINH) { render(); return; }
    const savedCode = localStorage.getItem('dieuphoi_code');
    if (savedCode) {
      try {
        const res = await apiGet('login', { code: savedCode });
        if (res.ok) { nguoi = res.nguoi; view = 'home'; }
      } catch (err) { /* để nguyên màn hình đăng nhập nếu lỗi */ }
    }
    render();
  })();
